name: Validate YummyAnime Lampa extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Verify committed bundle and build metadata
        run: node build.js --check

      - name: Rebuild bundled plugin
        run: node build.js

      - name: Check bundled plugin
        run: node --check dist/index.js

      - name: Check production bundle
        run: node --check stable/index.js

      - name: Run tests
        shell: bash
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "-- $test"
            node "$test"
          done
