<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>YummyAnime — новый UX для пульта</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="tv-app" class="tv-app">
    <aside class="rail" aria-label="Основная навигация">
      <img class="brand" src="../assets/yummyanime-official.svg" alt="YummyAnime">
      <nav id="tv-nav"></nav>
      <div class="rail-bottom">
        <button type="button" data-focus="nav-account" data-row="navigation" data-route="account" data-nav-down="nav-settings"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" width="100%" height="1em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><span>Аккаунт</span></button>
        <button type="button" data-focus="nav-settings" data-row="navigation" data-route="settings" data-nav-up="nav-account"><span class="nav-symbol" aria-hidden="true">⚙</span><span>Настройки</span></button>
      </div>
    </aside>
    <main id="tv-content" tabindex="-1"></main>
    <aside id="tv-panel" class="side-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden></aside>
  </div>
  <footer class="remote-guide"><div id="tv-hint"></div><div class="review-label">Концепт UX · Личные списки и прогресс — демо</div><output id="tv-message" aria-live="polite"></output></footer>
  <script src="../prototype-data.js"></script>
  <script src="../../../src/ui-scale.js"></script>
  <script src="navigation.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
